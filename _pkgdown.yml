url: https://ojwatson.github.io/magenta/

template:
  params:
    bootswatch: flatly

reference:
  - title: "Simulation"
    desc: "Functions for running magenta."
    contents:
      - pipeline
  - title: "Parameter lists"
    desc: >
      "Constructors for the parameter lists passed to pipeline(), each with a
      validator, and the record of the fields the C++ simulation reads."
    contents:
      - model_param_list_create
      - drug_list_create
      - housekeeping_list_create
      - nmf_list_create
      - vector_adaptation_list_create
      - barcode_list_create
      - cpp_contract
  - title: "Schedule and historic inputs"
    desc: >
      "The per-period schedule the simulation follows, and the functions that
      pull historic interventions and importation rates for an admin unit."
    contents:
      - build_schedule
      - spl_grab
      - intervention_grab
      - equilibrium_init_create
  - title: "Drug Functions"
    desc: "Functions to create drugs"
    contents:
      - drug_create
      - drug_create_al
      - drug_create_asaq
      - drug_create_dhappq
      - drug_create_default_no_resistance
      - drug_table
  - title: "Barcode Misc"
    desc: "Functions for converting and manipulating barcodes"
    contents:
      - convert_barcode_vectors
      - update_saved_state_barcode_plaf
  - title: "Data Objects"
    desc: "Internal Data Objects"
    contents:
      - admin_units_seasonal
      - irs_2000_2015
      - itn_2000_2015
      - drug_table
      - importations

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - Introduction
      - Loggers
  - title: "Antimalarial resistance"
    navbar: "Resistance"
    contents:
      - Resistance
      - DrugStrategies
      - NewDrugs

navbar:
  type: default
  left:
    - href: index.html
      icon: fa-home
